# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{%- endif %}\
            {% if commit.github.pr_number %} in #{{ commit.github.pr_number }}{%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove leading and trailing whitespace
trim = true

[git]
# parse the commits based on Conventional Commits
conventional_commits = true
# filter out commits that are not conventional
filter_unconventional = false
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Revert" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(version\\):", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps.*\\):", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
]
# protect breaking changes from being skipped
protect_breaking_commits = false
# filter out commits that are not matched by commit_parsers
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9].*"
# sort commits inside sections
sort_commits = "oldest"

[remote.github]
owner = "francescomosca"
repo = "aod4kde"

