name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release Assets (Portable Tarball & Arch Package)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies & tools
        run: |
          pacman -Syu --noconfirm \
            git \
            gcc \
            make \
            pkgconf \
            gettext \
            qt6-base \
            qt6-svg \
            qt6-declarative \
            ki18n \
            git-cliff

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package portable release tarball
        run: |
          bash tools/package-release.sh
          cd dist
          sha256sum aod4kde-linux-x86_64.tar.gz > aod4kde-linux-x86_64.tar.gz.sha256

      - name: Build Arch native package (.pkg.tar.zst) via makepkg
        run: |
          VERSION_FILE="$(tr -d ' \n\r' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION_FILE" ]; then
              echo "::error::Tag v$TAG does not match VERSION ($VERSION_FILE)"
              exit 1
            fi
          else
            TAG="$VERSION_FILE"
          fi

          useradd -m builduser
          
          mkdir -p /tmp/arch-build
          cp -r packaging/arch/aod4kde-bin/* /tmp/arch-build/
          cp dist/aod4kde-linux-x86_64.tar.gz /tmp/arch-build/aod4kde-v${TAG}-linux-x86_64.tar.gz

          cd /tmp/arch-build
          sed -i "s/^pkgver=.*/pkgver=$TAG/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          SHA_BIN=$(sha256sum aod4kde-v${TAG}-linux-x86_64.tar.gz | awk '{print $1}')
          sed -i "s/sha256sums=('.*')/sha256sums=('$SHA_BIN')/" PKGBUILD

          chown -R builduser:builduser /tmp/arch-build
          su builduser -c "cd /tmp/arch-build && makepkg -df --noconfirm"

          mkdir -p "$GITHUB_WORKSPACE/dist-arch"
          PKG_FILE=$(ls /tmp/arch-build/aod4kde-bin-[0-9]*.pkg.tar.zst | head -n1)
          cp "$PKG_FILE" "$GITHUB_WORKSPACE/dist-arch/"
          cp "$PKG_FILE" "$GITHUB_WORKSPACE/dist-arch/aod4kde-bin-x86_64.pkg.tar.zst"
          cd "$GITHUB_WORKSPACE/dist-arch"
          for pkg in *.pkg.tar.zst; do
            sha256sum "$pkg" > "${pkg}.sha256"
          done

      - name: Generate Changelog with git-cliff
        run: |
          git-cliff --latest --strip header --output RELEASE_NOTES.md || echo "Initial release" > RELEASE_NOTES.md

      - name: Prepare release artifacts directory
        run: |
          mkdir -p release-assets
          cp dist/aod4kde-linux-x86_64.tar.gz* release-assets/
          cp dist-arch/*.pkg.tar.zst* release-assets/
          cp RELEASE_NOTES.md release-assets/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-files/RELEASE_NOTES.md
          files: |
            release-files/*.tar.gz
            release-files/*.tar.gz.sha256
            release-files/*.pkg.tar.zst
            release-files/*.pkg.tar.zst.sha256

  aur-publish:
    name: Publish to AUR (Optional / when account available)
    needs: publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check AUR SSH Secret
        id: check-secret
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret is not configured. Skipping AUR push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git safe directory
        if: steps.check-secret.outputs.skip == 'false'
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Download release artifacts
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Setup SSH & System tools
        if: steps.check-secret.outputs.skip == 'false'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USER: ${{ secrets.AUR_USERNAME }}
          AUR_MAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          pacman -Syu --noconfirm git openssh curl
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur_rsa
          chmod 600 ~/.ssh/aur_rsa
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          cat << 'EOF' > ~/.ssh/config
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_rsa
            User aur
          EOF

          useradd -m builduser
          git config --global user.name "${AUR_USER:-GitHub Action}"
          git config --global user.email "${AUR_MAIL:-action@github.com}"

      - name: Update and push aod4kde-bin
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SHA_BIN=$(sha256sum dist/aod4kde-linux-x86_64.tar.gz | awk '{print $1}')

          git clone ssh://aur@aur.archlinux.org/aod4kde-bin.git /tmp/aur-bin
          cp packaging/arch/aod4kde-bin/PKGBUILD /tmp/aur-bin/PKGBUILD
          cp packaging/arch/aod4kde-bin/aod4kde.install /tmp/aur-bin/aod4kde.install

          cd /tmp/aur-bin
          sed -i "s/^pkgver=.*/pkgver=$TAG/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('$SHA_BIN')/" PKGBUILD

          chown -R builduser:builduser /tmp/aur-bin
          su builduser -c "cd /tmp/aur-bin && makepkg --printsrcinfo > .SRCINFO"

          git add PKGBUILD .SRCINFO aod4kde.install
          if ! git diff --cached --quiet; then
            git commit -m "Update aod4kde-bin to v$TAG"
            git push origin master
          fi

      - name: Update and push aod4kde (source)
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC_URL="https://github.com/francescomosca/aod4kde/archive/refs/tags/v${TAG}.tar.gz"
          curl -fsSL --retry 3 "$SRC_URL" -o /tmp/source.tar.gz
          SHA_SRC=$(sha256sum /tmp/source.tar.gz | awk '{print $1}')

          git clone ssh://aur@aur.archlinux.org/aod4kde.git /tmp/aur-src
          cp packaging/arch/aod4kde/PKGBUILD /tmp/aur-src/PKGBUILD
          cp packaging/arch/aod4kde/aod4kde.install /tmp/aur-src/aod4kde.install

          cd /tmp/aur-src
          sed -i "s/^pkgver=.*/pkgver=$TAG/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('$SHA_SRC')/" PKGBUILD

          chown -R builduser:builduser /tmp/aur-src
          su builduser -c "cd /tmp/aur-src && makepkg --printsrcinfo > .SRCINFO"

          git add PKGBUILD .SRCINFO aod4kde.install
          if ! git diff --cached --quiet; then
            git commit -m "Update aod4kde to v$TAG"
            git push origin master
          fi
